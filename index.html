<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Journey</title>
<style>
:root{
  --bg:#0b1020; --card:#121a2d; --card2:#172139; --text:#eef4ff; --muted:#91a0ba;
  --accent:#6ee7b7; --accent2:#60a5fa; --danger:#fb7185; --border:#263451;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#16213b 0,#0b1020 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.container{max-width:1050px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.brand{font-size:24px;font-weight:800}.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px;margin-top:5px}
.reset{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 13px;border-radius:10px;cursor:pointer}
.hero{background:linear-gradient(135deg,#14213b,#11192b);border:1px solid var(--border);border-radius:22px;padding:26px;margin-bottom:22px;box-shadow:0 18px 60px #0004}
.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{background:#0c1426aa;border:1px solid var(--border);border-radius:14px;padding:15px}
.stat b{font-size:22px;display:block}.stat small{color:var(--muted)}
.progress-wrap{margin-top:20px}.bar{height:12px;background:#0a1120;border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.35s;width:0}
.phase{background:var(--card);border:1px solid var(--border);border-radius:18px;margin:16px 0;overflow:hidden}
.phase-head{padding:19px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.phase-title{font-size:18px;font-weight:750}.phase-meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.locked{background:#202a3e;color:#71809a}.active{background:#1d3556;color:#7fc1ff}.progress{background:#123b38;color:#6ee7b7}.complete{background:#123b28;color:#6ee7b7}
.tasks{border-top:1px solid var(--border);padding:8px 12px 12px}
.task{display:flex;align-items:center;gap:13px;padding:13px 10px;border-radius:12px;margin:3px 0}
.task:hover{background:var(--card2)}
.check{width:23px;height:23px;border-radius:7px;border:1px solid #465572;background:#0c1425;display:grid;place-items:center;cursor:pointer;flex:none;color:#06130e;font-weight:900}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .name{text-decoration:line-through;color:#75849e}
.name{font-weight:600}.task-info{flex:1}.desc{font-size:12px;color:var(--muted);margin-top:3px}
.action{border:1px solid var(--border);background:#10192b;color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:12px}
.action:hover{border-color:#52709e}
.next{outline:1px solid #315c7c;background:#10223a}
@media(max-width:650px){header{align-items:flex-start}.stats{grid-template-columns:1fr}.hero h1{font-size:27px}.phase-head{align-items:flex-start}.task{align-items:flex-start}.action{display:none}}
</style>
</head>
<body>
<div class="container">
<header>
  <div><div class="brand">🔐 Cyber<span>Journey</span></div><div class="sub">Your personal cybersecurity roadmap</div></div>
  <button class="reset" onclick="resetAll()">Reset progress</button>
</header>

<section class="hero">
  <h1>Build the skill. Build the career.</h1>
  <p>One task at a time. Your progress is saved automatically on this device.</p>
  <div class="stats">
    <div class="stat"><b id="totalDone">0/0</b><small>Tasks completed</small></div>
    <div class="stat"><b id="percent">0%</b><small>Overall progress</small></div>
    <div class="stat"><b id="phaseCount">0/5</b><small>Phases completed</small></div>
  </div>
  <div class="progress-wrap"><div class="bar"><div class="fill" id="overallFill"></div></div></div>
</section>

<div id="roadmap"></div>
</div>

<script>
const phases = [
 {title:"Phase 1 — Foundation", icon:"🧱", tasks:[
  ["Networking basics","IP, DNS, HTTP/HTTPS, TCP/UDP and ports."],
  ["Windows security basics","Users, permissions, processes, services and Event Viewer."],
  ["Linux basics","Terminal, files, permissions, processes and essential commands."],
  ["Git & GitHub","Repositories, branches, commits and documenting projects."],
  ["Python basics","Variables, loops, functions, files and simple automation."],
  ["SQL basics","Queries, filtering, joins and understanding databases."],
  ["Cybersecurity fundamentals","CIA triad, threats, vulnerabilities, risk and security controls."]
 ]},
 {title:"Phase 2 — Security", icon:"🛡️", tasks:[
  ["CIA triad","Confidentiality, integrity and availability."],
  ["Authentication & authorization","Passwords, MFA, sessions, roles and access control."],
  ["Common attacks","Phishing, brute force, injection, credential attacks and more."],
  ["Malware & phishing","Types, indicators and safe analysis basics."],
  ["Vulnerabilities & CVEs","Understand vulnerabilities, severity and remediation."],
  ["Firewalls","Rules, ports, network filtering and basic troubleshooting."],
  ["Encryption & hashing","Symmetric/asymmetric encryption, hashes and certificates."],
  ["Incident response","Identify, contain, eradicate, recover and document."]
 ]},
 {title:"Phase 3 — SOC", icon:"🖥️", tasks:[
  ["Learn logs","Understand what useful security logs contain."],
  ["Windows Event Viewer","Find and interpret authentication and system events."],
  ["SIEM fundamentals","Understand collection, correlation, alerts and dashboards."],
  ["Alert investigation","Triage alerts and separate signal from noise."],
  ["Incident investigation","Build a timeline from evidence."],
  ["Threat intelligence","IOCs, context, enrichment and basic research."],
  ["MITRE ATT&CK basics","Map attacker behavior to tactics and techniques."]
 ]},
 {title:"Phase 4 — Portfolio", icon:"🚀", tasks:[
  ["Build a home cybersecurity lab","Create a safe environment for hands-on practice."],
  ["Security project #1","Complete and document one practical investigation/project."],
  ["Security project #2","Build a second project showing a different skill."],
  ["Security project #3","Build an optional advanced project."],
  ["GitHub documentation","Write clear READMEs, screenshots and lessons learned."],
  ["Cybersecurity resume","Create a focused junior-security resume."],
  ["LinkedIn profile","Present your skills, projects and learning journey."]
 ]},
 {title:"Phase 5 — Job", icon:"🎯", tasks:[
  ["Apply consistently","Start applying to internships and junior roles."],
  ["Interview practice","Practice networking, security and troubleshooting questions."],
  ["Project explanations","Be able to explain what you built and why."],
  ["Mock interviews","Practice communicating clearly under pressure."],
  ["Track applications","Record applications, responses and follow-ups."],
  ["Keep learning","Continue improving while applying and interviewing."]
 ]}
];

const KEY="cyberJourneyState";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");

function isDone(p,t){return !!state[`${p}-${t}`]}
function phaseDone(p){return phases[p].tasks.every((_,t)=>isDone(p,t))}
function phaseUnlocked(p){return p===0 || phaseDone(p-1)}
function toggle(p,t){
 if(!phaseUnlocked(p)) return;
 const k=`${p}-${t}`;
 state[k]=!state[k];
 localStorage.setItem(KEY,JSON.stringify(state));
 render();
}
function render(){
 const root=document.getElementById("roadmap");
 let total=0,done=0,completedPhases=0;
 phases.forEach((ph,p)=>{total+=ph.tasks.length; ph.tasks.forEach((_,t)=>{if(isDone(p,t))done++});if(phaseDone(p))completedPhases++});
 const pct=Math.round(done/total*100);
 document.getElementById("totalDone").textContent=`${done}/${total}`;
 document.getElementById("percent").textContent=pct+"%";
 document.getElementById("phaseCount").textContent=`${completedPhases}/${phases.length}`;
 document.getElementById("overallFill").style.width=pct+"%";
 root.innerHTML="";
 phases.forEach((ph,p)=>{
   const unlocked=phaseUnlocked(p), pd=phaseDone(p);
   const d=ph.tasks.filter((_,t)=>isDone(p,t)).length;
   let badge=pd?`<span class="badge complete">✓ COMPLETED</span>`:!unlocked?`<span class="badge locked">🔒 LOCKED</span>`:d?`<span class="badge progress">● IN PROGRESS</span>`:`<span class="badge active">○ READY</span>`;
   const section=document.createElement("section"); section.className="phase";
   section.innerHTML=`<div class="phase-head"><div><div class="phase-title">${ph.icon} ${ph.title}</div><div class="phase-meta">${d}/${ph.tasks.length} tasks completed</div></div>${badge}</div><div class="tasks"></div>`;
   const tasks=section.querySelector(".tasks");
   ph.tasks.forEach((task,t)=>{
     const doneNow=isDone(p,t);
     const can=unlocked;
     const row=document.createElement("div"); row.className="task"+(doneNow?" done":"")+(can&&!doneNow&&d===t?" next":"");
     row.innerHTML=`<div class="check">${doneNow?"✓":""}</div><div class="task-info"><div class="name">${task[0]}</div><div class="desc">${task[1]}</div></div><button class="action">${doneNow?"Undo":"Complete"}</button>`;
     row.querySelector(".check").onclick=()=>toggle(p,t);
     row.querySelector(".action").onclick=()=>toggle(p,t);
     if(!can){row.style.opacity=".5";row.querySelector(".action").disabled=true}
     tasks.appendChild(row);
   });
   root.appendChild(section);
 });
}
function resetAll(){
 if(confirm("Reset your entire cybersecurity progress?")){
  state={};localStorage.removeItem(KEY);render();
 }
}
render();
</script>

function renderCJ(){
 const root=document.getElementById('roadmap');let total=0,done=0,passed=0;phases.forEach((ph,p)=>{total+=ph.tasks.length;ph.tasks.forEach((_,t)=>{if(doneCJ(p,t))done++});if(passedCJ(p))passed++});const pct=Math.round(done/total*100);document.getElementById('totalDone').textContent=`${done}/${total}`;document.getElementById('percent').textContent=pct+'%';document.getElementById('phaseCount').textContent=`${passed}/${phases.length}`;document.getElementById('overallFill').style.width=pct+'%';root.innerHTML='';
 phases.forEach((ph,p)=>{const can=unlockedCJ(p),ad=allCJ(p),ps=passedCJ(p),d=ph.tasks.filter((_,t)=>doneCJ(p,t)).length;let badge=ps?'<span class="badge complete">✓ PASSED</span>':!can?'<span class="badge locked">🔒 LOCKED</span>':ad?'<span class="badge progress">🧪 TEST READY</span>':'<span class="badge active">○ IN PROGRESS</span>';const sec=document.createElement('section');sec.className='phase';sec.innerHTML=`<div class="phase-head"><div><div class="phase-title">${ph.icon} ${ph.title}</div><div class="phase-meta">${d}/${ph.tasks.length} tasks completed${cj.tests[p]?` · Best test: ${cj.tests[p].best}%`:''}</div></div>${badge}</div><div class="tasks"></div>`;const box=sec.querySelector('.tasks');ph.tasks.forEach((task,t)=>{const dd=doneCJ(p,t),r=document.createElement('div');r.className='task'+(dd?' done':'')+(can&&!dd&&d===t?' next':'');r.innerHTML=`<div class="check">${dd?'✓':''}</div><div class="task-info"><div class="name">${task[0]}</div><div class="desc">${task[1]}</div></div><button class="action">${dd?'Undo':'Complete'}</button>`;r.querySelector('.check').onclick=()=>toggleCJ(p,t);r.querySelector('.action').onclick=()=>toggleCJ(p,t);if(!can){r.style.opacity='.48';r.querySelector('.action').disabled=true}box.appendChild(r)});if(can){const tb=document.createElement('div');tb.className='testbox';tb.innerHTML=ps?`<div class="testinner"><h3>🎉 Phase assessment passed</h3><div class="testnote">Best score: ${cj.tests[p].best}% · Next phase unlocked.</div></div>`:ad?`<div class="testinner"><h3>🧪 Phase ${p+1} Test</h3><div class="testnote">20 questions · Need more than 85% to pass. With 20 questions, that means 18/20 (90%) or higher.</div><button class="action" style="margin-top:12px" onclick="startCJ(${p})">${cj.tests[p]?'Retake test':'Start test'}</button></div>`:`<div class="testinner"><h3>🔒 Test locked</h3><div class="testnote">Complete every task in this phase to unlock its 20-question assessment.</div></div>`;sec.appendChild(tb)}root.appendChild(sec)})
}
function startCJ(p){let q=QUIZ[p].slice();for(let i=q.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}quizState={p,qs:q,answers:Array(20).fill(null),i:0};document.getElementById('cjQuiz').classList.add('open');drawCJ()}
function drawCJ(){const q=quizState.qs[quizState.i],chosen=quizState.answers[quizState.i],b=document.getElementById('cjQuizBox');b.innerHTML=`<div class="qtop"><span>${phases[quizState.p].title} Test</span><span>Question ${quizState.i+1}/20</span></div><div class="qtext">${q[0]}</div><div id="opts"></div><div class="qactions"><button class="action" ${quizState.i===0?'disabled':''} onclick="backCJ()">← Back</button><button class="action" onclick="nextCJ()">${quizState.i===19?'Finish test':'Next →'}</button></div>`;const o=b.querySelector('#opts');q[1].forEach((txt,i)=>{const x=document.createElement('button');x.className='opt'+(chosen===i?' sel':'');x.textContent=txt;x.onclick=()=>{quizState.answers[quizState.i]=i;drawCJ()};o.appendChild(x)})}
function backCJ(){if(quizState.i>0){quizState.i--;drawCJ()}}
function nextCJ(){if(quizState.answers[quizState.i]===null){showToast('⚠️ Choose an answer','Select an option before continuing.');return}if(quizState.i<19){quizState.i++;drawCJ()}else finishCJ()}
function finishCJ(){let correct=0;quizState.qs.forEach((q,i)=>{if(quizState.answers[i]===q[2])correct++});const score=correct*5,p=quizState.p,pass=score>85,old=cj.tests[p]?.best||0;cj.tests[p]={score,passed:pass,best:Math.max(old,score),attempts:(cj.tests[p]?.attempts||0)+1};saveCJ();document.getElementById('cjQuizBox').innerHTML=`<div class="result"><div class="qtop"><span>Phase ${p+1} Test</span><span>${correct}/20 correct</span></div><div class="score ${pass?'pass':'fail'}">${score}%</div><h2>${pass?'🎉 PASSED':'🔴 NOT PASSED'}</h2><p class="testnote">${pass?'Excellent! The next phase is unlocked.':'You need more than 85%. Review the phase and retake the test.'}</p><button class="action" onclick="closeCJ()">${pass?'Continue':'Review phase'}</button></div>`;if(pass)showToast('🎉 Congratulations!',`You passed Phase ${p+1}. ${p<4?'Phase '+(p+2)+' is now unlocked!':'You completed the entire roadmap!'}`);else showToast('🔴 Test not passed',`You scored ${score}%. You need more than 85% to continue.`);renderCJ()}
function closeCJ(){document.getElementById('cjQuiz').classList.remove('open');quizState=null;renderCJ()}
function resetAll(){if(confirm('Reset all tasks, test scores and unlocked phases?')){cj={tasks:{},tests:{}};saveCJ();renderCJ();showToast('Reset complete','Your CyberJourney is back to Phase 1.')}}
renderCJ();
</script>
</body>
</html>
